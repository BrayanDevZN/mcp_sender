name: app_sender

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    app:

        runs-on: ubuntu-latest

        environment: develop

        env:
            email: ${{ secrets.EMAIL }}
            password: ${{ secrets. PASSWORD }}
            origin: "*"
            rate_limit: 20
            global_rate_limit: 200

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - name: create .env
              run: |
                cat <<EOF > .env
                EMAIL_USER=${{ secrets.EMAIL_USER }}
                EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
                JWT_SECRET=${{ secrets.JWT_SECRET }}
                EOF

            - name: init docker
              run: docker compose -f sender-alpine.yml up -d --build --wait
            - name: Docker debug
              if: always()
              run: |
                echo "=== CONTAINERS ==="
                docker compose -f sender-alpine.yml ps -a

                echo "=== CONSUMER LOGS ==="
                docker compose -f sender-alpine.yml logs --no-color consumer

                        
            - name: install requests
              run: pip install requests

            - name: execute test
              run: python -m tests.app
            

        


        

